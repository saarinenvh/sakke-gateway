name: Merge back

# Merges main into dev on every push to main, so dev never misses what went
# straight to main: documentation, urgent fixes and releases (sakke-workspace
# docs/roadmap/kubernetes/README.md, Branches and releases). A conflict fails
# the run, and is fixed by hand with a PR to dev.
#
# It pushes with the merge-back deploy key (secret MERGE_BACK_KEY), which dev's
# ruleset lets bypass its required checks: main's commits passed them already,
# and the merge commit is tested on dev right after. Unlike a GITHUB_TOKEN
# push, a deploy key's push starts ci.yml on dev, which builds dev's image.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One merge at a time; a push that lands meanwhile waits for the running one.
concurrency:
  group: merge-back
  cancel-in-progress: false

jobs:
  merge-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          ssh-key: ${{ secrets.MERGE_BACK_KEY }}
          # The whole history, which the merge needs to find the common base.
          fetch-depth: 0
          # Kept, unlike in ci.yml: the push below uses the key.
          persist-credentials: true

      - name: Merge main into dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          git merge --no-edit origin/main

          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "dev already has everything in main."
          else
            git push origin dev
          fi
