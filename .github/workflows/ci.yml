name: CI

on:
  push:
  pull_request:

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for tests/integration/database.test.ts. Same engine
      # and version as the server, so migrations are tested on what runs them.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sakke_gateway_test
          MARIADB_USER: sakke_gateway_test
          MARIADB_PASSWORD: ci-only-password
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_NAME: sakke_gateway_test
      TEST_DB_USERNAME: sakke_gateway_test
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes to git, so the token needn't stay in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile, so CI can't pass on a runtime the image
          # doesn't use.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # Covers the tests too: the main tsconfig includes them, and only
        # tsconfig.build.json leaves them out.
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Not redundant with the type-check - the build also copies the prompt
        # markdown that tsc doesn't emit, and that copy has broken before.
        run: npm run build

  image:
    # The artifact that actually gets deployed. Type-checking and tests both
    # pass against source that the image could still fail to produce.
    #
    # Pull requests only build it. Pushes to main also push it to GHCR, tagged
    # by the git tree it was built from, so the same files never build twice
    # and a release can reuse the image that already ran (sakke-workspace
    # docs/roadmap/kubernetes/README.md, Images).
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/saarinenvh/sakke-gateway
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes to git, so the token needn't stay in .git/config.
          persist-credentials: false

      - name: Work out the tags
        id: tags
        run: |
          echo "tree=tree-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the build if this tree's image exists
        id: existing
        if: env.PUSH == 'true'
        # Values reach the script as environment variables, never pasted into
        # its text, so the shell can't run them as code.
        env:
          TREE_TAG: ${{ steps.tags.outputs.tree }}
          SHA_TAG: ${{ steps.tags.outputs.sha }}
        run: |
          tree_ref="$IMAGE:$TREE_TAG"
          sha_ref="$IMAGE:$SHA_TAG"
          if output=$(docker buildx imagetools inspect "$tree_ref" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tree_ref already exists; not rebuilding, only adding $sha_ref."
            docker buildx imagetools create --tag "$sha_ref" "$tree_ref"

          # Only a missing tag builds. Any other error, such as an auth or
          # network problem, fails the run instead of rebuilding over a tag
          # that already points at an image.
          elif grep -qiE 'not found|manifest unknown' <<< "$output"; then
            echo "$tree_ref doesn't exist yet; building it."
          else
            echo "$output" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.exists != 'true'

      - name: Build the image, and push it on main
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tree }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Layers cached in GitHub's cache between runs, so a source-only
          # change reuses the dependency layers. A pull request's cache is
          # never read by main.
          cache-from: type=gha
          cache-to: type=gha,mode=max
