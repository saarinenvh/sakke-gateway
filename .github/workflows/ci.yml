name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the deploy-dev label pushes the PR's image and puts it in
    # dev. Removing the label is in dev-back-to-main.yml.
    types: [opened, synchronize, reopened, labeled]

# Read-only by default; a job that needs more asks for it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for tests/integration/database.test.ts. Same engine
      # and version as the server, so migrations are tested on what runs them.
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: sakke_gateway_test
          MARIADB_USER: sakke_gateway_test
          MARIADB_PASSWORD: ci-only-password
          MARIADB_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      TEST_DB_NAME: sakke_gateway_test
      TEST_DB_USERNAME: sakke_gateway_test
      TEST_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes to git, so the token needn't stay in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Matches the Dockerfile, so CI can't pass on a runtime the image
          # doesn't use.
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        # Covers the tests too: the main tsconfig includes them, and only
        # tsconfig.build.json leaves them out.
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        # Not redundant with the type-check - the build also copies the prompt
        # markdown that tsc doesn't emit, and that copy has broken before.
        run: npm run build

  zizmor:
    # Audits the workflows and dependabot.yml; any finding fails the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes to git, so the token needn't stay in .git/config.
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # Fail the run on a finding. With Advanced Security the action only
          # reports findings in the Security tab.
          advanced-security: false

  image:
    # The artifact that actually gets deployed. Type-checking and tests both
    # pass against source that the image could still fail to produce.
    #
    # It is pushed to GHCR on main, and for a PR from this repo that has the
    # deploy-dev label. Other PRs only build it. Its tags (sakke-workspace
    # docs/roadmap/kubernetes/README.md, Images):
    #   tree-<hash>    the files it was built from, so the same files never
    #                  build twice, and main reuses the image that ran in dev
    #   sha-<commit>   on main, the commit
    #   pr-<number>    on a PR, its latest image
    #   main, dev      what prod and dev run; Image Updater follows them
    #
    # Dependabot's own runs get a read-only token, so its pushes to a labeled
    # PR only build. Removing and adding the label again starts a run that
    # can push.
    needs: [test, zizmor]
    runs-on: ubuntu-latest
    # Runs on main finish in order, so an older one can't move main back.
    # Each PR run has a group of its own.
    concurrency:
      group: image-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      pull-requests: read
    env:
      IMAGE: ghcr.io/saarinenvh/sakke-gateway
      PUSH: >-
        ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository
            && contains(github.event.pull_request.labels.*.name, 'deploy-dev')
            && github.actor != 'dependabot[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes to git, so the token needn't stay in .git/config.
          persist-credentials: false

      - name: Work out the tags
        id: tags
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "tree=tree-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          if [[ -n $PR_NUMBER ]]; then
            echo "name=pr-$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "name=sha-$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip the build if this tree's image exists
        id: existing
        if: env.PUSH == 'true'
        # Values reach the script as environment variables, never pasted into
        # its text, so the shell can't run them as code.
        env:
          TREE_TAG: ${{ steps.tags.outputs.tree }}
          NAME_TAG: ${{ steps.tags.outputs.name }}
        run: |
          tree_ref="$IMAGE:$TREE_TAG"
          name_ref="$IMAGE:$NAME_TAG"
          if output=$(docker buildx imagetools inspect "$tree_ref" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tree_ref already exists; not rebuilding, only adding $name_ref."
            docker buildx imagetools create --tag "$name_ref" "$tree_ref"

          # Only a missing tag builds. Any other error, such as an auth or
          # network problem, fails the run instead of rebuilding over a tag
          # that already points at an image.
          elif grep -qiE 'not found|manifest unknown' <<< "$output"; then
            echo "$tree_ref doesn't exist yet; building it."
          else
            echo "$output" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.existing.outputs.exists != 'true'

      - name: Build the image, and push it on main and labeled PRs
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tree }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # Layers cached in GitHub's cache between runs, so a source-only
          # change reuses the dependency layers. A pull request's cache is
          # never read by main.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Moving a tag onto this image takes it off the image that had it.
      - name: Point prod or dev at the image
        if: env.PUSH == 'true'
        env:
          TREE_TAG: ${{ steps.tags.outputs.tree }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labeled=$(gh pr list --repo "$REPO" --label deploy-dev --state open --json number --jq '.[].number')

          if [[ -z $PR_NUMBER ]]; then
            # A re-run of an older run on main tags nothing, so it can't
            # roll prod back.
            if [[ $(gh api "repos/$REPO/commits/main" --jq .sha) != "$GITHUB_SHA" ]]; then
              echo "main has moved on from $GITHUB_SHA; not moving main."
              exit 0
            fi
            docker buildx imagetools create --tag "$IMAGE:main" "$IMAGE:$TREE_TAG"
            echo "main -> $TREE_TAG"

            # Dev runs main too, unless a PR is being tested there.
            if [[ -z $labeled ]]; then
              docker buildx imagetools create --tag "$IMAGE:dev" "$IMAGE:$TREE_TAG"
              echo "dev -> $TREE_TAG"
            fi

          # The label can be gone by now, if it was removed during the run.
          elif grep -qx "$PR_NUMBER" <<< "$labeled"; then
            docker buildx imagetools create --tag "$IMAGE:dev" "$IMAGE:$TREE_TAG"
            echo "dev -> $TREE_TAG (#$PR_NUMBER)"
          fi
